<!DOCTYPE html>
<html>

<head>
  <title>Title with 4 Images</title>
  <style>
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
      margin: 0;
      background-color: transparent;
    }

    iframe {
      pointer-events: none;
    }

    @keyframes titleEnter {
      0% {
        opacity: 0;
        scale: 0.3;
        filter: blur(20px);
      }
      100% {
        opacity: 1;
        scale: 1;
        filter: blur(0);
      }
    }

    @keyframes coreEnter {
      0% {
        opacity: 0;
        scale: 3;
        filter: blur(20px);
      }
      100% {
        opacity: 1;
        scale: 1;
        filter: blur(0);
      }
    }

    .images {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      max-height: 100%;
      user-select: none;
    }

    .images img {
      max-width: 100%;
      height: auto;
    }

    .images img:first-child {
      order: -1;
      animation: titleEnter 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0s both;
    }

    .images img:not(:first-child) {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
    }

    .images img:first-child {
      width: 100%;
    }

    .images img:nth-child(2) {
      width: 27%;
      -webkit-mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
      mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
    }

    .images img:nth-child(3) {
      width: 20%;
      -webkit-mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
      mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
    }

    .images img:nth-child(4) {
      width: 11%;
      -webkit-mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
      mask-image: linear-gradient(to bottom, rgba(140, 4, 254, 0), rgba(140, 4, 254, 1));
    }

    #myEmbed {
      overflow: hidden;
    }

    .rotate {
      animation: rotate 4s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .rotate-core-fast {
      animation-duration: 2s;
    }

    @keyframes colorChange {
      0% {
        filter: hue-rotate(0deg);
      }
      50% {
        filter: hue-rotate(180deg);
      }
      100% {
        filter: hue-rotate(0deg);
      }
    }

    .rotate-core1 {
      animation: 
        rotate1 10s linear infinite -1s, 
        colorChange 10s linear infinite -1s,
        coreEnter 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both;
    }

    .rotate-core2 {
      animation: 
        rotate2 20s linear infinite -0.5s, 
        colorChange 10s linear infinite -0.5s,
        coreEnter 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
    }

    .rotate-core3 {
      animation: 
        rotate3 8s linear infinite 0s, 
        colorChange 10s linear infinite 0s,
        coreEnter 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0s both;
    }

    @keyframes rotate1 {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes rotate2 {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes rotate3 {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(720deg);
      }
    }
  </style>
</head>

<body>
  <div class="images">
    <img src="https://raw.githubusercontent.com/XPISigma/constructcoreworks/main/Title.png" alt="Title" id="titleImage" />
    <img src="https://raw.githubusercontent.com/XPISigma/constructcoreworks/main/core3.png" alt="Core 3" class="rotate-core3" />
    <img src="https://raw.githubusercontent.com/XPISigma/constructcoreworks/main/core2.png" alt="Core 2" class="rotate-core2" />
    <img src="https://raw.githubusercontent.com/XPISigma/constructcoreworks/main/core1.png" alt="Core 1" class="rotate-core1" />
  </div>
  <script>
    const titleImage = document.getElementById('titleImage');
    const imagesContainer = document.querySelector('.images');
    let isAnimationFast = false;
    
    titleImage.addEventListener('click', () => {
      isAnimationFast = !isAnimationFast;
      imagesContainer.classList.toggle('rotate-core-fast', isAnimationFast);
    });
  </script>
</body>

</html>
